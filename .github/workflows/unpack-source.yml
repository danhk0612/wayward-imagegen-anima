name: Unpack source bootstrap

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/wayward-imagegen-anima-source.tar.gz
          tar -xzf /tmp/wayward-imagegen-anima-source.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add Anima per-character image generation backend"
          git push
