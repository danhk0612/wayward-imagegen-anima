name: Publish v0.2.0 release

on:
  push:
    branches:
      - task/tray-idle-v020
    paths:
      - .github/workflows/publish-v020-release.yml

permissions:
  contents: write

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0
      - uses: oven-sh/setup-bun@v2
      - name: Smoke tests
        run: bun scripts/smoke.ts
      - name: Build Lite ZIP
        shell: pwsh
        run: ./scripts/build-lite-release.ps1
      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Lite-v020
          path: dist/Wayward-Anima-ImageGen-Lite-*.zip
          if-no-files-found: error

  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0
      - uses: oven-sh/setup-bun@v2
      - name: Build Portable ZIP
        shell: pwsh
        run: ./scripts/build-portable-release.ps1
      - name: Upload Portable package
        uses: actions/upload-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Portable-v020
          path: dist/Wayward-Anima-ImageGen-Portable-*.zip
          if-no-files-found: error

  release:
    needs: [build-lite, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0
      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "0.2.0"
          test "$(git rev-list -n 1 v0.2.0)" = "c98bc96e22f730e08de58a6a27af7f3ccbe7a1cf"
      - name: Download Lite package
        uses: actions/download-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Lite-v020
          path: release-assets
      - name: Download Portable package
        uses: actions/download-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Portable-v020
          path: release-assets
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v0.2.0             release-assets/*.zip             release-assets/SHA256SUMS.txt             --verify-tag             --title "Wayward Anima ImageGen v0.2.0"             --generate-notes
