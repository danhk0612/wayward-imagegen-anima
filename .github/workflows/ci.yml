name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: CLI import/syntax smoke
        run: bun src/cli.ts --help
      - name: Anima graph smoke test
        run: bun scripts/smoke.ts
