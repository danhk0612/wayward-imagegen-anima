name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: CLI import/syntax smoke
        run: bun src/cli.ts --help
      - name: Anima graph smoke test
        run: bun scripts/smoke.ts
      - name: Browser UI smoke test
        run: bun scripts/ui-smoke.ts
      - name: Idle shutdown state smoke test
        run: bun scripts/idle-shutdown-smoke.ts
      - name: Runtime integration smoke test
        run: bun scripts/runtime-integration-smoke.ts
      - name: Active HTTP shutdown lifecycle smoke test
        run: bun scripts/http-lifecycle-smoke.ts
      - name: Lite package smoke
        shell: pwsh
        run: ./scripts/build-lite-release.ps1

  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Windows PowerShell 5.1 script parse
        shell: powershell
        run: |
          $scripts = Get-ChildItem scripts -Filter '*.ps1' -File
          foreach ($script in $scripts) {
            $text = Get-Content $script.FullName -Raw
            $null = [scriptblock]::Create($text)
            Write-Host "OK $($script.Name)"
          }
      - name: Build Portable ZIP
        shell: pwsh
        run: ./scripts/build-portable-release.ps1
      - name: Compiled CLI smoke
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory -Filter 'Wayward-Anima-ImageGen-Portable-*' | Select-Object -First 1
          if (-not $stage) { throw 'Portable staging directory not found.' }
          $backend = Join-Path $stage.FullName 'wayward-imagegen'
          $exe = Join-Path $backend 'wayward-imagegen.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Compiled CLI --help failed.' }
      - name: External server manager lifecycle smoke
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory -Filter 'Wayward-Anima-ImageGen-Portable-*' | Select-Object -First 1
          if (-not $stage) { throw 'Portable staging directory not found.' }
          $manager = Join-Path $stage.FullName 'Wayward-Anima-Server.ps1'
          $managerCmd = Join-Path $stage.FullName 'Wayward-Anima-Server.cmd'
          $tray = Join-Path $stage.FullName 'Wayward-Anima-Tray.ps1'
          $trayCmd = Join-Path $stage.FullName 'Wayward-Anima-Tray.cmd'
          if (-not (Test-Path $manager) -or -not (Test-Path $managerCmd)) { throw 'Server manager entry points are missing.' }
          if (-not (Test-Path $tray) -or -not (Test-Path $trayCmd)) { throw 'Tray manager entry points are missing.' }

          & $manager -Action Status -GameRoot $stage.FullName
          & $manager -Action Start -GameRoot $stage.FullName

          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 250
            try {
              $s = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings' -TimeoutSec 2
              if ($s.configPath -match 'Wayward-Anima-ImageGen-Portable') { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) { throw 'Server manager did not start the target backend.' }

          & $manager -Action Status -GameRoot $stage.FullName

          # A manager pointed at a different Wayward root must refuse to stop
          # the backend that belongs to this stage.
          $foreignRoot = Join-Path $env:RUNNER_TEMP 'Wayward-foreign-owner'
          New-Item -ItemType Directory -Path $foreignRoot -Force | Out-Null
          $refused = $false
          try {
            & $manager -Action Stop -GameRoot $foreignRoot
          }
          catch {
            $refused = $true
          }
          if (-not $refused) { throw 'Foreign Wayward manager did not refuse to stop the target backend.' }
          if (-not (Get-NetTCPConnection -LocalPort 8189 -State Listen -ErrorAction SilentlyContinue)) {
            throw 'Foreign Wayward manager stopped another installation backend.'
          }

          & $manager -Action Stop -GameRoot $stage.FullName
          Start-Sleep -Milliseconds 500
          if (Get-NetTCPConnection -LocalPort 8189 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Server manager did not release port 8189.'
          }

      - name: Safe Portable update smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Wayward-safe-update'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $backend = Join-Path $root 'wayward-imagegen'
          $art = Join-Path $backend 'art-library\illustrious\characters\elena'
          $state = Join-Path $backend 'runtime-state'
          New-Item -ItemType Directory -Path $art -Force | Out-Null
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $backend 'src') -Force | Out-Null
          Set-Content -Path (Join-Path $root 'index.html') -Value '<html><body>fixture</body></html>' -Encoding UTF8
          Set-Content -Path (Join-Path $backend 'wayward-imagegen.config.json') -Value '{"imagePreset":"anima","imagesDir":"art-library","stateDir":"runtime-state","marker":"preserve-me"}' -Encoding UTF8
          Set-Content -Path (Join-Path $art 'existing.png') -Value 'existing-image' -Encoding UTF8
          Set-Content -Path (Join-Path $state 'batch.json') -Value '{"paused":true}' -Encoding UTF8
          Set-Content -Path (Join-Path $backend 'src\stale.ts') -Value '// stale portable source' -Encoding UTF8
          Set-Content -Path (Join-Path $root 'Wayward-Anima.cmd') -Value '@echo stale' -Encoding ASCII

          $built = Get-ChildItem dist -Directory -Filter 'Wayward-Anima-ImageGen-Portable-*' | Select-Object -First 1
          if (-not $built) { throw 'Portable stage not found for updater smoke.' }
          Copy-Item (Join-Path $built.FullName 'wayward-imagegen\wayward-imagegen.exe') (Join-Path $backend 'wayward-imagegen.exe') -Force
          Copy-Item (Join-Path $built.FullName 'wayward-imagegen\ui') (Join-Path $backend 'ui') -Recurse -Force
          $running = Start-Process -FilePath (Join-Path $backend 'wayward-imagegen.exe') -WorkingDirectory $backend -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 250
            try {
              $s = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings' -TimeoutSec 2
              if ($s.configPath -match 'Wayward-safe-update') { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) {
            if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force }
            throw 'Fixture backend did not start for updater smoke.'
          }

          $beforeConfig = (Get-FileHash (Join-Path $backend 'wayward-imagegen.config.json') -Algorithm SHA256).Hash
          $beforeImage = (Get-FileHash (Join-Path $art 'existing.png') -Algorithm SHA256).Hash
          $beforeState = (Get-FileHash (Join-Path $state 'batch.json') -Algorithm SHA256).Hash

          ./scripts/install-portable-to-wayward.ps1 -GameRoot $root
          Start-Sleep -Milliseconds 500
          if (-not $running.HasExited) { throw 'Installer did not shut down the idle target backend before update.' }

          $afterConfig = (Get-FileHash (Join-Path $backend 'wayward-imagegen.config.json') -Algorithm SHA256).Hash
          $afterImage = (Get-FileHash (Join-Path $art 'existing.png') -Algorithm SHA256).Hash
          $afterState = (Get-FileHash (Join-Path $state 'batch.json') -Algorithm SHA256).Hash
          if ($beforeConfig -ne $afterConfig) { throw 'Portable updater changed config.' }
          if ($beforeImage -ne $afterImage) { throw 'Portable updater changed configured image library.' }
          if ($beforeState -ne $afterState) { throw 'Portable updater changed configured state directory.' }
          if (Test-Path (Join-Path $backend 'src')) { throw 'Portable updater left stale source directory.' }
          if (-not (Test-Path (Join-Path $backend 'wayward-imagegen.exe'))) { throw 'Portable updater did not install compiled backend.' }

      - name: Compiled server and UI smoke
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist -Directory -Filter 'Wayward-Anima-ImageGen-Portable-*' | Select-Object -First 1
          $backend = Join-Path $stage.FullName 'wayward-imagegen'
          $exe = Join-Path $backend 'wayward-imagegen.exe'

          # Disposable Wayward-like fixture for reversible image-pack tests.
          Set-Content -Path (Join-Path $stage.FullName 'index.html') -Value '<html><body>fixture</body></html>' -Encoding UTF8
          Set-Content -Path (Join-Path $stage.FullName 'images-elena-1.js') -Value '// fixture manifest' -Encoding UTF8
          $staticDir = Join-Path $stage.FullName 'images\illustrious\characters\elena'
          New-Item -ItemType Directory -Path $staticDir -Force | Out-Null
          Set-Content -Path (Join-Path $staticDir 'fixture.webp') -Value 'fixture' -Encoding UTF8

          $proc = Start-Process -FilePath $exe -WorkingDirectory $backend -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8189/setup.html' -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match 'Wayward Anima ImageGen') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Compiled backend did not serve setup.html.' }

            $wayward = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/wayward'
            if (-not $wayward.detected) { throw 'Disposable Wayward root was not detected.' }
            if ($wayward.characters.elena.activeManifests.Count -ne 1) { throw 'Fixture static manifest was not detected.' }
            if (-not $wayward.characters.elena.staticImagesPresent) { throw 'Fixture static image directory was not detected.' }

            $disableBody = @{ characterId = 'elena'; mode = 'disable' } | ConvertTo-Json
            Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/static-pack' -Method Post -ContentType 'application/json' -Body $disableBody | Out-Null
            if (Test-Path (Join-Path $stage.FullName 'images-elena-1.js')) { throw 'Static manifest was not disabled.' }
            if (-not (Test-Path (Join-Path $stage.FullName '_disabled-imagepacks\elena\images-elena-1.js'))) { throw 'Disabled manifest backup was not created.' }
            if (Test-Path $staticDir) { throw 'Static image directory was not disabled.' }

            $restoreBody = @{ characterId = 'elena'; mode = 'restore' } | ConvertTo-Json
            Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/static-pack' -Method Post -ContentType 'application/json' -Body $restoreBody | Out-Null
            if (-not (Test-Path (Join-Path $stage.FullName 'images-elena-1.js'))) { throw 'Static manifest was not restored.' }
            if (-not (Test-Path (Join-Path $staticDir 'fixture.webp'))) { throw 'Static image directory was not restored.' }

            $before = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings'
            $settings = $before.settings
            $settings.steps = 31
            $settings.idleShutdownEnabled = $true
            $settings.idleShutdownMinutes = 15
            $settings.characterProfiles = @{
              test = @{
                loras = @()
                triggerPrompt = 'test_trigger'
                basePrompt = 'blue hair'
                gamePromptPrefixToStrip = ''
                positivePromptPrefix = ''
                positivePromptSuffix = ''
                negativePromptPrefix = ''
                negativePromptSuffix = ''
              }
            }
            $settings.characterDirs = @('test')
            $body = @{ settings = $settings } | ConvertTo-Json -Depth 20
            $saved = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings' -Method Post -ContentType 'application/json' -Body $body
            if ($saved.restartRequired) { throw 'Unchanged ComfyUI URL should not require restart.' }
            if (-not $saved.appliedImmediately) { throw 'Setup changes were not applied immediately.' }

            $after = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings'
            if ($after.settings.steps -ne 31) { throw 'Live setup step change was not visible.' }
            if (-not $after.settings.characterProfiles.test) { throw 'Live character profile change was not visible.' }

            $runtime = Invoke-RestMethod 'http://127.0.0.1:8189/api/control/status'
            if ($runtime.instance.configPath -notmatch 'Wayward-Anima-ImageGen-Portable') { throw 'Runtime status did not expose installation identity.' }
            if (-not $runtime.idleShutdown.enabled -or $runtime.idleShutdown.minutes -ne 15) { throw 'Idle shutdown setup did not apply live.' }
            if (-not $runtime.lastGameRequestAt) { throw 'Runtime status did not expose last game request time.' }

            # A second save should create an automatic backup of the first
            # config; restoring it writes that full JSON back atomically.
            $settings.steps = 32
            $body2 = @{ settings = $settings } | ConvertTo-Json -Depth 20
            $saved2 = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/settings' -Method Post -ContentType 'application/json' -Body $body2
            if ($saved2.restartRequired) { throw 'Second save unexpectedly required restart.' }

            $backups = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/backups'
            if (-not $backups.backups -or $backups.backups.Count -lt 1) { throw 'Automatic config backup was not created.' }
            $restoreBody = @{ name = $backups.backups[0].name } | ConvertTo-Json
            $restored = Invoke-RestMethod 'http://127.0.0.1:8189/api/setup/backups/restore' -Method Post -ContentType 'application/json' -Body $restoreBody
            if (-not $restored.restartRequired) { throw 'Full backup restore must require restart.' }

            $restoredFile = Get-Content (Join-Path $backend 'wayward-imagegen.config.json') -Raw | ConvertFrom-Json
            if ($restoredFile.steps -ne 31) { throw 'Restored config file did not contain the backed-up step value.' }
          }
          finally {
            try { Invoke-RestMethod 'http://127.0.0.1:8189/api/control/shutdown' -Method Post -TimeoutSec 2 | Out-Null } catch { }
            Start-Sleep -Milliseconds 500
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
