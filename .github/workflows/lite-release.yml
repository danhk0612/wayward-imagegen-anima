name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Smoke tests
        run: bun scripts/smoke.ts
      - name: Build Lite ZIP
        shell: pwsh
        run: ./scripts/build-lite-release.ps1
      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Lite
          path: dist/*.zip
          if-no-files-found: error

  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build Portable ZIP
        shell: pwsh
        run: ./scripts/build-portable-release.ps1
      - name: Upload Portable package
        uses: actions/upload-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Portable
          path: dist/Wayward-Anima-ImageGen-Portable-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-lite, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi

      - name: Download Lite package
        uses: actions/download-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Lite
          path: release-assets

      - name: Download Portable package
        uses: actions/download-artifact@v4
        with:
          name: Wayward-Anima-ImageGen-Portable
          path: release-assets

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Wayward Anima ImageGen ${GITHUB_REF_NAME}" \
            --generate-notes
